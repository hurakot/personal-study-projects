
<!-- create_record.html - Страница создания отчёта для задания -->

{% extends 'base.html' %}

{% block content %}

    <link rel="stylesheet" href="{{ url_for('static', filename='create_account.css') }}">

    <div class="form-card">

        <h1 class="form-title">Создание отчёта</h1>

        <!-- Форма отправляется на тот же маршрут create_record с id текущего задания -->
        <form method="POST" action="{{ url_for('create_record', id_task=task.id_task) }}"
              onsubmit="prepareImages()">

            <div class="form-grid">
            <!-- Каждая строка = подпись слева + поле справа -->
                <label class="grid1-label" for="text_report">Напишите текст отчёта:</label>
                <input class="grid1-input" id="text_report" name="text_report" type="text" placeholder="Текст отчёта">

                <label class="grid1-label">Загрузите фотографии, доказывающие выполнение миссии:</label>

                <!-- Зона перетаскивания фотографий -->
                <div id="drop-zone">
                    Перетащите фотографии сюда<br>или нажмите, чтобы выбрать
                </div>
            </div>

            <!-- Скрытый выбор файлов (открывается по клику на drop-zone) -->
            <input type="file" id="file-input" accept="image/*" multiple style="display:none;">

            <!-- Сюда JS кладёт JSON-массив всех фото в base64 перед отправкой -->
            <input type="hidden" name="images_data" id="images-data">

            <!-- Предпросмотр выбранных фотографий -->
            <div class="preview-area" id="preview"></div>

            <div class="text-end mt-3">
                <button type="submit" class="btn form-btn">Отправить отчёт</button>
            </div>
        </form>
    </div>

    <style>
        #drop-zone {
            border: 2px dashed #ccc;
            border-radius: 16px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #555;
        }
        #drop-zone.drag-over {
            border-color: #007bff;
            background-color: #e9f5ff;
        }
        .preview-area {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
        }
        .preview-area img {
            max-width: 140px;
            max-height: 140px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }
    </style>

    <script>
        // Массив, в который складываем base64 всех скинутых фотографий
        let collectedImages = [];

        const dropZone  = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const preview   = document.getElementById('preview');

        // --- Перетаскивание ---
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('drag-over');
        });
        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('drag-over');
        });
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('drag-over');
            handleFiles(e.dataTransfer.files);
        });

        // --- Клик по зоне открывает выбор файлов ---
        dropZone.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', () => handleFiles(fileInput.files));

        // Обрабатываем каждый выбранный/скинутый файл
        function handleFiles(files) {
            for (const file of files) {
                if (!file.type.startsWith('image/')) {
                    alert('Можно загружать только изображения.');
                    continue;
                }
                const reader = new FileReader();
                reader.onload = (e) => {
                    const base64 = e.target.result;
                    collectedImages.push(base64);          // запоминаем для отправки
                    const img = document.createElement('img');
                    img.src = base64;                      // показываем предпросмотр
                    preview.appendChild(img);
                };
                reader.readAsDataURL(file);
            }
        }

        // Перед отправкой формы кладём все фото в скрытое поле как JSON
        function prepareImages() {
            document.getElementById('images-data').value = JSON.stringify(collectedImages);
        }
    </script>

{% endblock %}
